# ============================================================================
#  Pages CMS 설정 파일  (https://pagescms.org)
#  이 파일이 저장소 루트에 있어야 Pages CMS가 편집 화면을 만들어 줍니다.
#
#  ── 편집 가능한 것은 딱 세 가지입니다 ──
#    ① 프로젝트  : 새 프로젝트의 주소만 입력 (지구본에 자동으로 찍힘)
#    ② 뉴스      : 새 뉴스 추가
#    ③ 채용      : 새 채용공고 추가
#
#  회사 소개·연혁·주요공법·CONTACT·섹션 문구 등 나머지는 전부 고정값입니다.
#  바꿔야 할 일이 생기면 content/*.json 파일을 직접 수정하세요.
#  (예전에는 이것들도 CMS에 떠 있었지만, 실수로 건드리기 쉬워 걷어냈습니다)
#
#  다국어 필드는 { ko, en, zh, ja } 4칸입니다. 한국어만 채워도 되고,
#  비워 둔 언어는 자동으로 한국어가 표시됩니다.
# ============================================================================

media:
  - name: images
    label: 이미지
    input: uploads/images
    output: /uploads/images
    extensions: [jpg, jpeg, png, webp, gif, svg]
  - name: data
    label: 실적 엑셀
    input: uploads/data
    output: /uploads/data
    extensions: [xlsx]

content:

  # --------------------------------------------------------------------------
  # ① 프로젝트 — 주소만 넣으면 지구본에 점이 찍힙니다.
  #
  #    실적 대부분은 uploads/data/projects.xlsx (A열 = 주소) 에서 자동으로
  #    읽어 옵니다. 여기 목록은 엑셀에 아직 반영되지 않은 신규 건을
  #    한 건씩 덧붙이는 용도입니다.
  # --------------------------------------------------------------------------
  - name: projects
    label: ① 프로젝트 (주소 추가)
    type: file
    path: content/projects.json
    format: json
    fields:
      - name: addresses
        label: 신규 프로젝트 주소
        type: object
        list: true
        description: >
          "서울시 강남구 테헤란로 123" 처럼 시/도 + 시/군/구가 들어가게 적어 주세요.
          시군구까지 인식되면 정확한 위치에, 시도만 인식되면 그 지역 중심에 찍힙니다.
        fields:
          - name: address
            label: 주소
            type: string
            required: true
          - name: team
            label: 담당 (선택)
            type: string
            description: 구조1, 진단 등. 비워도 됩니다.

  # --------------------------------------------------------------------------
  # ② 뉴스
  # --------------------------------------------------------------------------
  - name: news
    label: ② 뉴스
    type: file
    path: content/news.json
    format: json
    fields:
      - name: items
        label: 뉴스 목록
        type: object
        list: true
        description: 날짜 기준 최신순으로 자동 정렬됩니다.
        fields:
          - name: id
            label: 고유 ID
            type: string
            required: true
            description: 영문·숫자·하이픈 (예 news-2026-09-award). 중복만 아니면 됩니다.
          - name: date
            label: 날짜
            type: date
            required: true
          - name: category
            label: 분류
            type: object
            description: >
              기존 분류(언론보도 / 행사 / 논문 / 기술자료)와 똑같이 적어야
              같은 필터 버튼으로 묶입니다.
            fields:
              - { name: ko, label: 한국어, type: string }
              - { name: en, label: English, type: string }
              - { name: zh, label: 中文,    type: string }
              - { name: ja, label: 日本語,  type: string }
          - name: image
            label: 썸네일
            type: image
            description: 비워 두면 블루 그라디언트가 표시됩니다.
          - name: link
            label: 원문 링크
            type: string
            description: 입력하면 카드 전체가 새 탭 링크가 됩니다.
          - name: title
            label: 제목
            type: object
            fields:
              - { name: ko, label: 한국어, type: string }
              - { name: en, label: English, type: string }
              - { name: zh, label: 中文,    type: string }
              - { name: ja, label: 日本語,  type: string }
          - name: excerpt
            label: 요약
            type: object
            fields:
              - { name: ko, label: 한국어, type: text }
              - { name: en, label: English, type: text }
              - { name: zh, label: 中文,    type: text }
              - { name: ja, label: 日本語,  type: text }

  # --------------------------------------------------------------------------
  # ③ 채용공고
  # --------------------------------------------------------------------------
  - name: careers
    label: ③ 채용공고
    type: file
    path: content/careers.json
    format: json
    fields:
      - name: applyEmail
        label: 지원 접수 이메일 (전체 기본값)
        type: string
      - name: jobs
        label: 채용공고
        type: object
        list: true
        fields:
          - name: id
            label: 고유 ID
            type: string
            required: true
            description: 영문·숫자·하이픈 (예 job-2026-structure).
          - name: email
            label: 이 공고 전용 접수 메일
            type: string
            description: 비워 두면 위의 기본 접수 이메일을 씁니다.
          - name: deadline
            label: 마감일
            type: date
            description: 비워 두면 마감 배지가 표시되지 않습니다 (상시채용).
          - name: title
            label: 공고명
            type: object
            fields:
              - { name: ko, label: 한국어, type: string }
              - { name: en, label: English, type: string }
              - { name: zh, label: 中文,    type: string }
              - { name: ja, label: 日本語,  type: string }
          - name: team
            label: 소속
            type: object
            fields:
              - { name: ko, label: 한국어, type: string }
              - { name: en, label: English, type: string }
              - { name: zh, label: 中文,    type: string }
              - { name: ja, label: 日本語,  type: string }
          - name: type
            label: 고용형태
            type: object
            fields:
              - { name: ko, label: 한국어, type: string }
              - { name: en, label: English, type: string }
              - { name: zh, label: 中文,    type: string }
              - { name: ja, label: 日本語,  type: string }
          - name: location
            label: 근무지
            type: object
            fields:
              - { name: ko, label: 한국어, type: string }
              - { name: en, label: English, type: string }
              - { name: zh, label: 中文,    type: string }
              - { name: ja, label: 日本語,  type: string }
          - name: description
            label: 담당 업무
            type: object
            fields:
              - { name: ko, label: 한국어, type: text }
              - { name: en, label: English, type: text }
              - { name: zh, label: 中文,    type: text }
              - { name: ja, label: 日本語,  type: text }
          - name: requirements
            label: 자격 요건
            type: object
            list: true
            fields:
              - { name: ko, label: 한국어, type: string }
              - { name: en, label: English, type: string }
              - { name: zh, label: 中文,    type: string }
              - { name: ja, label: 日本語,  type: string }
          - name: preferred
            label: 우대 사항
            type: object
            list: true
            fields:
              - { name: ko, label: 한국어, type: string }
              - { name: en, label: English, type: string }
              - { name: zh, label: 中文,    type: string }
              - { name: ja, label: 日本語,  type: string }
