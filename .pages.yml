# ============================================================================
#  Pages CMS 설정 파일  (https://pagescms.org)
#  이 파일이 저장소 루트에 있어야 Pages CMS가 편집 화면을 만들어 줍니다.
#  - media   : 이미지/PDF 업로드 위치
#  - content : 편집할 JSON 파일과 각 항목의 입력 폼 정의
#  다국어 필드는 { ko, en, zh, ja } 4칸짜리 object 로 정의되어 있습니다.
# ============================================================================

media:
  - name: images
    label: 이미지
    input: uploads/images
    output: /uploads/images
    extensions: [jpg, jpeg, png, webp, gif, svg]
  - name: docs
    label: PDF 자료
    input: uploads/docs
    output: /uploads/docs
    extensions: [pdf]

content:

  # --------------------------------------------------------------------------
  # 1) 사이트 공통 — 회사명, 히어로, 메뉴 라벨, 버튼 문구, 푸터
  # --------------------------------------------------------------------------
  - name: site
    label: ① 사이트 공통
    type: file
    path: content/site.json
    format: json
    fields:
      - name: company
        label: 회사 정보
        type: object
        fields:
          - { name: shortName, label: 로고 약칭, type: string }
          - name: name
            label: 회사명
            type: object
            fields:
              - { name: ko, label: 한국어, type: string }
              - { name: en, label: English, type: string }
              - { name: zh, label: 中文,    type: string }
              - { name: ja, label: 日本語,  type: string }

      - name: seo
        label: 검색엔진 / 공유 정보
        type: object
        fields:
          - name: title
            label: 페이지 제목
            type: object
            fields:
              - { name: ko, label: 한국어, type: string }
              - { name: en, label: English, type: string }
              - { name: zh, label: 中文,    type: string }
              - { name: ja, label: 日本語,  type: string }
          - name: description
            label: 페이지 설명
            type: object
            fields:
              - { name: ko, label: 한국어, type: text }
              - { name: en, label: English, type: text }
              - { name: zh, label: 中文,    type: text }
              - { name: ja, label: 日本語,  type: text }

      - name: hero
        label: 첫 화면 (Hero)
        type: object
        fields:
          - name: eyebrow
            label: 작은 라벨
            type: object
            fields:
              - { name: ko, label: 한국어, type: string }
              - { name: en, label: English, type: string }
              - { name: zh, label: 中文,    type: string }
              - { name: ja, label: 日本語,  type: string }
          - name: title
            label: 큰 제목 (줄바꿈 가능)
            type: object
            fields:
              - { name: ko, label: 한국어, type: text }
              - { name: en, label: English, type: text }
              - { name: zh, label: 中文,    type: text }
              - { name: ja, label: 日本語,  type: text }
          - name: subtitle
            label: 부제
            type: object
            fields:
              - { name: ko, label: 한국어, type: text }
              - { name: en, label: English, type: text }
              - { name: zh, label: 中文,    type: text }
              - { name: ja, label: 日本語,  type: text }
          - name: stats
            label: 숫자 지표
            type: object
            list: true
            fields:
              - { name: value, label: 숫자, type: string }
              - name: label
                label: 설명
                type: object
                fields:
                  - { name: ko, label: 한국어, type: string }
                  - { name: en, label: English, type: string }
                  - { name: zh, label: 中文,    type: string }
                  - { name: ja, label: 日本語,  type: string }

      - name: nav
        label: 메뉴 이름
        type: object
        fields:
          - name: about
            label: 메뉴1 · 회사소개
            type: object
            fields:
              - { name: ko, label: 한국어, type: string }
              - { name: en, label: English, type: string }
              - { name: zh, label: 中文,    type: string }
              - { name: ja, label: 日本語,  type: string }
          - name: news
            label: 메뉴2 · 뉴스
            type: object
            fields:
              - { name: ko, label: 한국어, type: string }
              - { name: en, label: English, type: string }
              - { name: zh, label: 中文,    type: string }
              - { name: ja, label: 日本語,  type: string }
          - name: projects
            label: 메뉴3 · 프로젝트
            type: object
            fields:
              - { name: ko, label: 한국어, type: string }
              - { name: en, label: English, type: string }
              - { name: zh, label: 中文,    type: string }
              - { name: ja, label: 日本語,  type: string }
          - name: careers
            label: 메뉴4 · 채용
            type: object
            fields:
              - { name: ko, label: 한국어, type: string }
              - { name: en, label: English, type: string }
              - { name: zh, label: 中文,    type: string }
              - { name: ja, label: 日本語,  type: string }
          - name: sub
            label: 회사소개 하위 메뉴
            type: object
            fields:
              - name: ceo
                label: CEO 인사말
                type: object
                fields:
                  - { name: ko, label: 한국어, type: string }
                  - { name: en, label: English, type: string }
                  - { name: zh, label: 中文,    type: string }
                  - { name: ja, label: 日本語,  type: string }
              - name: history
                label: 회사연혁
                type: object
                fields:
                  - { name: ko, label: 한국어, type: string }
                  - { name: en, label: English, type: string }
                  - { name: zh, label: 中文,    type: string }
                  - { name: ja, label: 日本語,  type: string }
              - name: methods
                label: 주요공법
                type: object
                fields:
                  - { name: ko, label: 한국어, type: string }
                  - { name: en, label: English, type: string }
                  - { name: zh, label: 中文,    type: string }
                  - { name: ja, label: 日本語,  type: string }
              - name: contact
                label: CONTACT
                type: object
                fields:
                  - { name: ko, label: 한국어, type: string }
                  - { name: en, label: English, type: string }
                  - { name: zh, label: 中文,    type: string }
                  - { name: ja, label: 日本語,  type: string }

      - name: ui
        label: 버튼 / 안내 문구
        description: 사이트 전체에서 반복 사용되는 짧은 문구입니다. 자주 바꿀 일은 없습니다.
        type: object
        fields:
          - name: downloadPdf
            label: PDF 다운로드 버튼
            type: object
            fields:
              - { name: ko, label: 한국어, type: string }
              - { name: en, label: English, type: string }
              - { name: zh, label: 中文,    type: string }
              - { name: ja, label: 日本語,  type: string }
          - name: pdfSoon
            label: PDF 없음 표시
            type: object
            fields:
              - { name: ko, label: 한국어, type: string }
              - { name: en, label: English, type: string }
              - { name: zh, label: 中文,    type: string }
              - { name: ja, label: 日本語,  type: string }
          - name: readMore
            label: 자세히 보기
            type: object
            fields:
              - { name: ko, label: 한국어, type: string }
              - { name: en, label: English, type: string }
              - { name: zh, label: 中文,    type: string }
              - { name: ja, label: 日本語,  type: string }
          - name: viewDetail
            label: 상세 보기
            type: object
            fields:
              - { name: ko, label: 한국어, type: string }
              - { name: en, label: English, type: string }
              - { name: zh, label: 中文,    type: string }
              - { name: ja, label: 日本語,  type: string }
          - name: loadMore
            label: 더 보기
            type: object
            fields:
              - { name: ko, label: 한국어, type: string }
              - { name: en, label: English, type: string }
              - { name: zh, label: 中文,    type: string }
              - { name: ja, label: 日本語,  type: string }
          - name: all
            label: 전체 (필터)
            type: object
            fields:
              - { name: ko, label: 한국어, type: string }
              - { name: en, label: English, type: string }
              - { name: zh, label: 中文,    type: string }
              - { name: ja, label: 日本語,  type: string }
          - name: empty
            label: 내용 없음 안내
            type: object
            fields:
              - { name: ko, label: 한국어, type: string }
              - { name: en, label: English, type: string }
              - { name: zh, label: 中文,    type: string }
              - { name: ja, label: 日本語,  type: string }
          - name: apply
            label: 지원하기 버튼
            type: object
            fields:
              - { name: ko, label: 한국어, type: string }
              - { name: en, label: English, type: string }
              - { name: zh, label: 中文,    type: string }
              - { name: ja, label: 日本語,  type: string }
          - name: sendMail
            label: 메일 안내 문구
            type: object
            fields:
              - { name: ko, label: 한국어, type: string }
              - { name: en, label: English, type: string }
              - { name: zh, label: 中文,    type: string }
              - { name: ja, label: 日本語,  type: string }
          - name: mailSubject
            label: 문의 메일 기본 제목
            type: object
            fields:
              - { name: ko, label: 한국어, type: string }
              - { name: en, label: English, type: string }
              - { name: zh, label: 中文,    type: string }
              - { name: ja, label: 日本語,  type: string }

      - name: footer
        label: 푸터
        type: object
        fields:
          - name: address
            label: 주소
            type: object
            fields:
              - { name: ko, label: 한국어, type: string }
              - { name: en, label: English, type: string }
              - { name: zh, label: 中文,    type: string }
              - { name: ja, label: 日本語,  type: string }
          - name: tel
            label: 전화 / 팩스
            type: object
            fields:
              - { name: ko, label: 한국어, type: string }
              - { name: en, label: English, type: string }
              - { name: zh, label: 中文,    type: string }
              - { name: ja, label: 日本語,  type: string }
          - name: copyright
            label: 저작권 표기
            type: object
            fields:
              - { name: ko, label: 한국어, type: string }
              - { name: en, label: English, type: string }
              - { name: zh, label: 中文,    type: string }
              - { name: ja, label: 日本語,  type: string }

  # --------------------------------------------------------------------------
  # 2) 회사소개 — CEO 인사말 / 회사연혁 / 주요공법(PDF) / CONTACT
  # --------------------------------------------------------------------------
  - name: about
    label: ② 회사소개
    type: file
    path: content/about.json
    format: json
    fields:
      - name: section
        label: 섹션 머리말
        type: object
        fields:
          - name: eyebrow
            label: 작은 라벨
            type: object
            fields:
              - { name: ko, label: 한국어, type: string }
              - { name: en, label: English, type: string }
              - { name: zh, label: 中文,    type: string }
              - { name: ja, label: 日本語,  type: string }
          - name: title
            label: 제목
            type: object
            fields:
              - { name: ko, label: 한국어, type: text }
              - { name: en, label: English, type: text }
              - { name: zh, label: 中文,    type: text }
              - { name: ja, label: 日本語,  type: text }
          - name: lead
            label: 소개 문단
            type: object
            fields:
              - { name: ko, label: 한국어, type: text }
              - { name: en, label: English, type: text }
              - { name: zh, label: 中文,    type: text }
              - { name: ja, label: 日本語,  type: text }

      - name: ceo
        label: CEO 인사말
        type: object
        fields:
          - name: heading
            label: 소제목
            type: object
            fields:
              - { name: ko, label: 한국어, type: string }
              - { name: en, label: English, type: string }
              - { name: zh, label: 中文,    type: string }
              - { name: ja, label: 日本語,  type: string }
          - { name: photo, label: 사진, type: image, options: { media: images } }
          - name: quote
            label: 인용문
            type: object
            fields:
              - { name: ko, label: 한국어, type: text }
              - { name: en, label: English, type: text }
              - { name: zh, label: 中文,    type: text }
              - { name: ja, label: 日本語,  type: text }
          - name: body
            label: 본문 (빈 줄 하나로 문단 구분)
            type: object
            fields:
              - { name: ko, label: 한국어, type: text }
              - { name: en, label: English, type: text }
              - { name: zh, label: 中文,    type: text }
              - { name: ja, label: 日本語,  type: text }
          - name: role
            label: 직함
            type: object
            fields:
              - { name: ko, label: 한국어, type: string }
              - { name: en, label: English, type: string }
              - { name: zh, label: 中文,    type: string }
              - { name: ja, label: 日本語,  type: string }
          - name: name
            label: 성명
            type: object
            fields:
              - { name: ko, label: 한국어, type: string }
              - { name: en, label: English, type: string }
              - { name: zh, label: 中文,    type: string }
              - { name: ja, label: 日本語,  type: string }
          - name: careerLabel
            label: 약력 접기 제목
            type: object
            fields:
              - { name: ko, label: 한국어, type: string }
              - { name: en, label: English, type: string }
              - { name: zh, label: 中文,    type: string }
              - { name: ja, label: 日本語,  type: string }
          - name: career
            label: 약력 항목
            type: object
            list: true
            fields:
              - { name: ko, label: 한국어, type: string }
              - { name: en, label: English, type: string }
              - { name: zh, label: 中文,    type: string }
              - { name: ja, label: 日本語,  type: string }

      - name: history
        label: 회사연혁
        type: object
        fields:
          - name: heading
            label: 소제목
            type: object
            fields:
              - { name: ko, label: 한국어, type: string }
              - { name: en, label: English, type: string }
              - { name: zh, label: 中文,    type: string }
              - { name: ja, label: 日本語,  type: string }
          - name: lead
            label: 설명
            type: object
            fields:
              - { name: ko, label: 한국어, type: text }
              - { name: en, label: English, type: text }
              - { name: zh, label: 中文,    type: text }
              - { name: ja, label: 日本語,  type: text }
          - name: items
            label: 연혁 항목
            type: object
            list: true
            fields:
              - { name: year, label: 연도, type: string }
              - name: title
                label: 제목
                type: object
                fields:
                  - { name: ko, label: 한국어, type: string }
                  - { name: en, label: English, type: string }
                  - { name: zh, label: 中文,    type: string }
                  - { name: ja, label: 日本語,  type: string }
              - name: desc
                label: 설명
                type: object
                fields:
                  - { name: ko, label: 한국어, type: text }
                  - { name: en, label: English, type: text }
                  - { name: zh, label: 中文,    type: text }
                  - { name: ja, label: 日本語,  type: text }

      - name: methods
        label: 주요공법
        type: object
        fields:
          - name: heading
            label: 소제목
            type: object
            fields:
              - { name: ko, label: 한국어, type: string }
              - { name: en, label: English, type: string }
              - { name: zh, label: 中文,    type: string }
              - { name: ja, label: 日本語,  type: string }
          - name: lead
            label: 설명
            type: object
            fields:
              - { name: ko, label: 한국어, type: text }
              - { name: en, label: English, type: text }
              - { name: zh, label: 中文,    type: text }
              - { name: ja, label: 日本語,  type: text }
          - name: items
            label: 공법 목록
            type: object
            list: true
            fields:
              - { name: code, label: 공법 약칭 (PSRC 등), type: string }
              - name: name
                label: 공법명
                type: object
                fields:
                  - { name: ko, label: 한국어, type: string }
                  - { name: en, label: English, type: string }
                  - { name: zh, label: 中文,    type: string }
                  - { name: ja, label: 日本語,  type: string }
              - name: summary
                label: 한 줄 요약
                type: object
                fields:
                  - { name: ko, label: 한국어, type: text }
                  - { name: en, label: English, type: text }
                  - { name: zh, label: 中文,    type: text }
                  - { name: ja, label: 日本語,  type: text }
              - name: points
                label: 특징 (여러 개)
                type: object
                list: true
                fields:
                  - { name: ko, label: 한국어, type: string }
                  - { name: en, label: English, type: string }
                  - { name: zh, label: 中文,    type: string }
                  - { name: ja, label: 日本語,  type: string }
              - { name: image, label: 대표 이미지, type: image, options: { media: images } }
              - { name: pdf,   label: 기술자료 PDF, type: file,  options: { media: docs } }

      - name: contact
        label: CONTACT
        type: object
        fields:
          - name: heading
            label: 소제목
            type: object
            fields:
              - { name: ko, label: 한국어, type: string }
              - { name: en, label: English, type: string }
              - { name: zh, label: 中文,    type: string }
              - { name: ja, label: 日本語,  type: string }
          - name: lead
            label: 설명
            type: object
            fields:
              - { name: ko, label: 한국어, type: text }
              - { name: en, label: English, type: text }
              - { name: zh, label: 中文,    type: text }
              - { name: ja, label: 日本語,  type: text }
          - name: generalLabel
            label: 대표 메일 라벨
            type: object
            fields:
              - { name: ko, label: 한국어, type: string }
              - { name: en, label: English, type: string }
              - { name: zh, label: 中文,    type: string }
              - { name: ja, label: 日本語,  type: string }
          - name: generalEmail
            label: 대표 문의 이메일
            type: string
            pattern: { regex: "^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$", message: "올바른 이메일 형식이 아닙니다." }
          - name: offices
            label: 사업장 목록
            type: object
            list: true
            fields:
              - name: tag
                label: 구분 (본사/공장 등)
                type: object
                fields:
                  - { name: ko, label: 한국어, type: string }
                  - { name: en, label: English, type: string }
                  - { name: zh, label: 中文,    type: string }
                  - { name: ja, label: 日本語,  type: string }
              - name: name
                label: 사업장명
                type: object
                fields:
                  - { name: ko, label: 한국어, type: string }
                  - { name: en, label: English, type: string }
                  - { name: zh, label: 中文,    type: string }
                  - { name: ja, label: 日本語,  type: string }
              - name: address
                label: 주소
                type: object
                fields:
                  - { name: ko, label: 한국어, type: text }
                  - { name: en, label: English, type: text }
                  - { name: zh, label: 中文,    type: text }
                  - { name: ja, label: 日本語,  type: text }
              - { name: tel,   label: 전화, type: string }
              - { name: fax,   label: 팩스, type: string }
              - { name: email, label: 이메일 (선택), type: string }

  # --------------------------------------------------------------------------
  # 3) 뉴스
  # --------------------------------------------------------------------------
  - name: news
    label: ③ 뉴스
    type: file
    path: content/news.json
    format: json
    fields:
      - name: section
        label: 섹션 머리말
        type: object
        fields:
          - name: eyebrow
            label: 작은 라벨
            type: object
            fields:
              - { name: ko, label: 한국어, type: string }
              - { name: en, label: English, type: string }
              - { name: zh, label: 中文,    type: string }
              - { name: ja, label: 日本語,  type: string }
          - name: title
            label: 제목
            type: object
            fields:
              - { name: ko, label: 한국어, type: string }
              - { name: en, label: English, type: string }
              - { name: zh, label: 中文,    type: string }
              - { name: ja, label: 日本語,  type: string }
          - name: lead
            label: 설명
            type: object
            fields:
              - { name: ko, label: 한국어, type: text }
              - { name: en, label: English, type: text }
              - { name: zh, label: 中文,    type: text }
              - { name: ja, label: 日本語,  type: text }

      - name: items
        label: 뉴스 목록
        type: object
        list: { min: 0 }
