<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SEN Engineering Group</title>
<meta name="description" content="1973년부터 이어온 건축구조 원스톱 엔지니어링. PSRC · TSC 선조립 합성구조 공법.">
<meta property="og:type" content="website">
<meta property="og:title" content="SEN Engineering Group">
<meta property="og:description" content="1973년부터 이어온 건축구조 원스톱 엔지니어링.">
<meta property="og:image" content="assets/img/og.jpg">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">

<!-- 웹폰트: 필요 없으면 이 두 줄을 지우면 됩니다 (시스템 폰트로 자동 대체) -->
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&display=swap">

<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/layout.css">
<link rel="stylesheet" href="assets/css/components.css">

<!-- 스크롤 등장 애니메이션 사용 여부를 <html> 클래스로 먼저 정합니다.
     아래 조건을 모두 만족할 때만 .js-anim 이 붙고, 그때만 요소가 숨겨진 채 시작합니다.
       · 자바스크립트가 동작할 것
       · 페이지가 지금 실제로 화면에 보이는 상태일 것 (백그라운드 탭에서 열리면 제외)
       · 사용자가 '모션 줄이기'를 켜지 않았을 것
       · IntersectionObserver 를 지원할 것
     하나라도 아니면 클래스가 안 붙어 처음부터 그냥 또렷하게 보입니다.
     ※ 이 스크립트는 CSS 링크 뒤, 첫 화면 그리기 전에 실행되어야 하므로 위치를 옮기지 마세요. -->
<script>
(function () {
  try {
    if (document.visibilityState && document.visibilityState !== 'visible') return;
    if (!window.matchMedia || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    if (!('IntersectionObserver' in window)) return;
    document.documentElement.className += ' js-anim';
  } catch (e) { /* 무슨 일이 있어도 내용은 보여야 합니다 */ }
})();
</script>
</head>
<body>

<!-- 스크롤 진행 바 -->
<div class="scroll-progress" aria-hidden="true"><span data-scroll-bar></span></div>

<!-- ============ 상단 고정 헤더 ============ -->
<header class="site-header" data-header>
  <div class="shell header__inner">

    <a class="logo" href="#top" data-anchor>
      <span class="logo__mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" fill="none"><path d="M4 24V8h10a5 5 0 0 1 0 10H9l9 6H4Z" fill="currentColor"/><path d="M20 8h8v3h-8zM20 21h8v3h-8z" fill="currentColor" opacity=".55"/></svg>
      </span>
      <span class="logo__text">
        <strong data-bind="site.company.shortName">SEN</strong>
        <em data-bind="site.company.name">Engineering Group</em>
      </span>
    </a>

    <nav class="nav" data-nav aria-label="주 메뉴">
      <ul class="nav__list">
        <li class="nav__item has-sub">
          <a href="#about" data-anchor data-bind="site.nav.about">회사소개</a>
          <ul class="nav__sub" data-subnav>
            <li><a href="#ceo"     data-anchor data-bind="site.nav.sub.ceo">CEO 인사말</a></li>
            <li><a href="#history" data-anchor data-bind="site.nav.sub.history">회사연혁</a></li>
            <li><a href="#methods" data-anchor data-bind="site.nav.sub.methods">주요공법</a></li>
            <li><a href="#contact" data-anchor data-bind="site.nav.sub.contact">CONTACT</a></li>
          </ul>
        </li>
        <li class="nav__item"><a href="#news"     data-anchor data-bind="site.nav.news">뉴스</a></li>
        <li class="nav__item"><a href="#projects" data-anchor data-bind="site.nav.projects">프로젝트</a></li>
        <li class="nav__item"><a href="#careers"  data-anchor data-bind="site.nav.careers">채용</a></li>
      </ul>
    </nav>

    <!-- 언어 토글 (한/영/중/일) -->
    <div class="langswitch" data-langswitch>
      <button class="langswitch__btn" type="button" aria-haspopup="true" aria-expanded="false" data-lang-toggle>
        <svg class="ico" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="7.4" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M2.6 10h14.8M10 2.6c4 4.6 4 10.8 0 14.8M10 2.6c-4 4.6-4 10.8 0 14.8" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
        <span data-lang-current>KO</span>
      </button>
      <ul class="langswitch__menu" data-lang-menu role="menu">
        <li><button type="button" data-lang="ko" role="menuitem">한국어</button></li>
        <li><button type="button" data-lang="en" role="menuitem">English</button></li>
        <li><button type="button" data-lang="zh" role="menuitem">中文</button></li>
        <li><button type="button" data-lang="ja" role="menuitem">日本語</button></li>
      </ul>
    </div>

    <button class="burger" type="button" aria-label="메뉴 열기" aria-expanded="false" data-burger>
      <span></span><span></span><span></span>
    </button>

  </div>
</header>

<!-- 모바일 드로어 -->
<div class="drawer" data-drawer hidden>
  <nav class="drawer__nav" aria-label="모바일 메뉴">
    <a href="#about"    data-anchor data-bind="site.nav.about">회사소개</a>
    <div class="drawer__sub">
      <a href="#ceo"     data-anchor data-bind="site.nav.sub.ceo">CEO 인사말</a>
      <a href="#history" data-anchor data-bind="site.nav.sub.history">회사연혁</a>
      <a href="#methods" data-anchor data-bind="site.nav.sub.methods">주요공법</a>
      <a href="#contact" data-anchor data-bind="site.nav.sub.contact">CONTACT</a>
    </div>
    <a href="#news"     data-anchor data-bind="site.nav.news">뉴스</a>
    <a href="#projects" data-anchor data-bind="site.nav.projects">프로젝트</a>
    <a href="#careers"  data-anchor data-bind="site.nav.careers">채용</a>
  </nav>
</div>

<main id="top">

  <!-- ============ HERO ============ -->
  <section class="hero" id="hero">
    <div class="hero__bg" data-hero-bg></div>
    <div class="shell hero__inner">
      <p class="hero__eyebrow reveal" data-bind="site.hero.eyebrow"></p>
      <h1 class="hero__title reveal" data-bind="site.hero.title"></h1>
      <p class="hero__subtitle reveal" data-bind="site.hero.subtitle"></p>
      <ul class="hero__stats reveal" data-list="site.hero.stats"></ul>
    </div>
    <a class="hero__scroll" href="#about" data-anchor aria-label="아래로 스크롤"><span></span></a>
  </section>

  <!-- ============ 1. 회사소개 ============ -->
  <section class="section section--about" id="about" data-section="about">

    <div class="shell">
      <header class="section__head reveal">
        <p class="eyebrow" data-bind="about.section.eyebrow"></p>
        <h2 class="section__title" data-bind="about.section.title"></h2>
        <p class="section__lead" data-bind="about.section.lead"></p>
      </header>
    </div>

    <!-- 1-1 CEO 인사말 -->
    <div class="block" id="ceo" data-sub="ceo">
      <div class="shell ceo">
        <div class="ceo__media reveal">
          <img data-src="about.ceo.photo" alt="" loading="lazy">
        </div>
        <div class="ceo__body reveal">
          <h3 class="block__title" data-bind="about.ceo.heading"></h3>
          <blockquote class="ceo__quote" data-bind="about.ceo.quote"></blockquote>
          <div class="prose" data-prose="about.ceo.body"></div>
          <p class="ceo__sign">
            <span class="ceo__role" data-bind="about.ceo.role"></span>
            <strong class="ceo__name" data-bind="about.ceo.name"></strong>
          </p>
          <details class="ceo__career">
            <summary data-bind="about.ceo.careerLabel"></summary>
            <ul data-list="about.ceo.career"></ul>
          </details>
        </div>
      </div>
    </div>

    <!-- 1-2 회사연혁 -->
    <div class="block block--tint" id="history" data-sub="history">
      <div class="shell">
        <h3 class="block__title reveal" data-bind="about.history.heading"></h3>
        <p class="block__lead reveal" data-bind="about.history.lead"></p>
        <ol class="timeline" data-list="about.history.items"></ol>
      </div>
    </div>

    <!-- 1-3 주요공법 (공법별 PDF 다운로드) -->
    <div class="block" id="methods" data-sub="methods">
      <div class="shell">
        <h3 class="block__title reveal" data-bind="about.methods.heading"></h3>
        <p class="block__lead reveal" data-bind="about.methods.lead"></p>
        <div class="methods" data-list="about.methods.items"></div>
      </div>
    </div>

    <!-- 1-4 CONTACT -->
    <div class="block block--navy" id="contact" data-sub="contact">
      <div class="shell">
        <h3 class="block__title reveal" data-bind="about.contact.heading"></h3>
        <p class="block__lead reveal" data-bind="about.contact.lead"></p>

        <div class="contact__primary reveal">
          <a class="mailcard" data-mail="about.contact.generalEmail">
            <span class="mailcard__label" data-bind="about.contact.generalLabel"></span>
            <span class="mailcard__value" data-mailtext="about.contact.generalEmail"></span>
            <span class="mailcard__cta" data-bind="site.ui.sendMail"></span>
          </a>
        </div>

        <div class="offices" data-list="about.contact.offices"></div>
      </div>
    </div>

  </section>

  <!-- ============ 2. 뉴스 ============ -->
  <section class="section section--news" id="news" data-section="news">
    <div class="shell">
      <header class="section__head reveal">
        <p class="eyebrow" data-bind="news.section.eyebrow"></p>
        <h2 class="section__title" data-bind="news.section.title"></h2>
        <p class="section__lead" data-bind="news.section.lead"></p>
      </header>

      <div class="chips" data-newsfilter></div>
      <div class="cards cards--news" data-list="news.items"></div>
      <div class="more">
        <button class="btn btn--ghost" type="button" data-more="news" data-bind="site.ui.loadMore"></button>
      </div>
    </div>
  </section>

  <!-- ============ 3. 프로젝트 ============ -->
  <section class="section section--projects" id="projects" data-section="projects">
    <div class="shell">
      <header class="section__head reveal">
        <p class="eyebrow" data-bind="projects.section.eyebrow"></p>
        <h2 class="section__title" data-bind="projects.section.title"></h2>
        <p class="section__lead" data-bind="projects.section.lead"></p>
      </header>

      <div class="chips" data-projectfilter></div>
      <div class="cards cards--projects" data-list="projects.items"></div>
      <div class="more">
        <button class="btn btn--ghost" type="button" data-more="projects" data-bind="site.ui.loadMore"></button>
      </div>
    </div>
  </section>

  <!-- ============ 4. 채용 ============ -->
  <section class="section section--careers" id="careers" data-section="careers">
    <div class="shell">
      <header class="section__head reveal">
        <p class="eyebrow" data-bind="careers.section.eyebrow"></p>
        <h2 class="section__title" data-bind="careers.section.title"></h2>
        <p class="section__lead" data-bind="careers.section.lead"></p>
      </header>

      <div class="values" data-list="careers.values"></div>

      <h3 class="block__title reveal" data-bind="careers.jobsHeading"></h3>
      <div class="jobs" data-list="careers.jobs"></div>

      <div class="process reveal">
        <h3 class="block__title" data-bind="careers.processHeading"></h3>
        <ol class="process__list" data-list="careers.process"></ol>
      </div>
    </div>
  </section>

</main>

<!-- ============ 푸터 ============ -->
<footer class="site-footer">
  <div class="shell footer__inner">
    <div class="footer__brand">
      <strong data-bind="site.company.name"></strong>
      <p data-bind="site.footer.address"></p>
      <p data-bind="site.footer.tel"></p>
    </div>
    <nav class="footer__nav" aria-label="푸터 메뉴">
      <a href="#about"    data-anchor data-bind="site.nav.about"></a>
      <a href="#news"     data-anchor data-bind="site.nav.news"></a>
      <a href="#projects" data-anchor data-bind="site.nav.projects"></a>
      <a href="#careers"  data-anchor data-bind="site.nav.careers"></a>
    </nav>
    <p class="footer__copy" data-bind="site.footer.copyright"></p>
  </div>
</footer>

<!-- 프로젝트 상세 모달 -->
<div class="modal" data-modal hidden>
  <div class="modal__backdrop" data-modal-close></div>
  <div class="modal__panel" role="dialog" aria-modal="true">
    <button class="modal__close" type="button" data-modal-close aria-label="닫기">&times;</button>
    <div class="modal__body" data-modal-body></div>
  </div>
</div>

<script src="assets/js/i18n.js"></script>
<script src="assets/js/render.js"></script>
<script src="assets/js/nav.js"></script>
<script src="assets/js/reveal.js"></script>
<script src="assets/js/main.js"></script>
</body>
</html>
